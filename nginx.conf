# =============================================================================
# Nginx config interne au conteneur frontend (servi en HTTP sur :80)
# Le HTTPS et le routing externe sont gérés par le reverse-proxy Nginx
# situé devant (deployment/nginx/conf.d/goldyara.ma.conf).
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sécurité : ne pas leak la version
    server_tokens off;

    # Healthcheck pour Docker / load-balancer
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Assets fingerprintés par Vite : cache long
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images / favicons / fichiers statiques sous /public
    location ~* \.(?:jpg|jpeg|gif|png|svg|webp|avif|ico|woff2?|ttf|otf|eot)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml font/ttf font/otf;

    # SPA fallback : toute route non-asset retourne index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Pas de caching de l'index (sinon les utilisateurs restent bloqués sur une vieille version)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }
}
