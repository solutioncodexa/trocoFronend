name: CI Frontend (Artifacts)

on:
  push:
    branches: [feature/shopify, shopify, main, master]
    paths:
      - "src/**"
      - "public/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "playwright.config.ts"
      - "tsconfig*.json"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "index.html"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [feature/shopify, shopify, main, master]
    paths:
      - "src/**"
      - "public/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "playwright.config.ts"
      - "tsconfig*.json"
      - "index.html"
      - ".github/workflows/ci-frontend.yml"
  workflow_dispatch:
    inputs:
      vite_api_base_url:
        description: "VITE_API_BASE_URL au build (vide = vars.VITE_API_BASE_URL ou /api)"
        required: false
        default: ""
      skip_e2e:
        description: "Skip Playwright E2E (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: troco-front-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/goldyara/deployment' }}

jobs:
  test-unit:
    name: Tests auto (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

  test-e2e:
    name: Tests auto (Playwright E2E)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_e2e != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (mocked)
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build-frontend:
    name: Build dist
    needs: [test-unit, test-e2e]
    # Continuer si e2e skipped via workflow_dispatch
    if: |
      always() &&
      needs.test-unit.result == 'success' &&
      (needs.test-e2e.result == 'success' || needs.test-e2e.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Resolve VITE_API_BASE_URL
        id: vite_api
        run: |
          if [ -n "${{ github.event.inputs.vite_api_base_url }}" ]; then
            echo "url=${{ github.event.inputs.vite_api_base_url }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "url=${{ vars.VITE_API_BASE_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=/api" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ steps.vite_api.outputs.url }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: troco-frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy-frontend:
    name: Deploy frontend on VPS
    needs: [test-unit, test-e2e, build-frontend]
    if: |
      always() &&
      needs.test-unit.result == 'success' &&
      (needs.test-e2e.result == 'success' || needs.test-e2e.result == 'skipped') &&
      needs.build-frontend.result == 'success' &&
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/feature/shopify' ||
        github.ref == 'refs/heads/shopify' ||
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master'
      ) &&
      vars.VPS_DEPLOY_DISABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Validate VPS deploy config
        env:
          H: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          U: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          K: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -e
          rc=0
          [ -z "${H:-}" ] && echo "::error::Missing VPS_HOST or VPS_IP" && rc=1
          [ -z "${U:-}" ] && echo "::error::Missing VPS_USER" && rc=1
          [ -z "${K:-}" ] && echo "::error::Missing VPS_SSH_PRIVATE_KEY" && rc=1
          exit "$rc"

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: troco-frontend-dist
          path: deploy-download

      - name: Prepare Troco frontend directory on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ vars.VPS_SSH_PORT || '22' }}
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/goldyara/deployment}"
            FRONT_ROOT="${DEPLOY_PATH}/troco/frontend"
            mkdir -p "${FRONT_ROOT}/dist" "${FRONT_ROOT}/dist-upload"
            rm -rf "${FRONT_ROOT}/dist/"* "${FRONT_ROOT}/dist-upload/"* || true

      - name: Upload dist payload to VPS staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ vars.VPS_SSH_PORT || '22' }}
          source: "deploy-download/*"
          target: "${{ env.DEPLOY_PATH }}/troco/frontend/dist-upload"

      - name: Normalize dist + restart troco-frontend
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ vars.VPS_SSH_PORT || '22' }}
          command_timeout: 15m
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/goldyara/deployment}"
            FRONT_ROOT="${DEPLOY_PATH}/troco/frontend"
            DIST_DIR="${FRONT_ROOT}/dist"
            UPLOAD_DIR="${FRONT_ROOT}/dist-upload"

            mkdir -p "${DIST_DIR}"
            if [ -d "${UPLOAD_DIR}/deploy-download" ]; then
              mv "${UPLOAD_DIR}/deploy-download/"* "${DIST_DIR}/" || true
              rm -rf "${UPLOAD_DIR}/deploy-download"
            fi
            find "${UPLOAD_DIR}" -mindepth 1 -maxdepth 1 -exec mv {} "${DIST_DIR}/" \; || true
            rm -rf "${UPLOAD_DIR}"

            test -f "${DIST_DIR}/index.html" || { echo "index.html missing"; ls -la "${DIST_DIR}" || true; exit 1; }

            cd "${DEPLOY_PATH}"
            if [ ! -f .env.troco ] || [ ! -f docker-compose.troco.yml ]; then
              echo "ERROR: bootstrap Troco manquant (.env.troco / docker-compose.troco.yml)"
              exit 1
            fi

            mkdir -p docker
            docker compose --env-file .env --env-file .env.troco \
              -f docker-compose.yml \
              -f docker-compose.artifacts.yml \
              -f docker-compose.troco.yml \
              up -d --force-recreate --no-deps troco-frontend

            echo "troco-frontend recrée"

      - name: Deploy summary
        if: success()
        run: |
          {
            echo "### Troco frontend déployé"
            echo ""
            echo "| Champ | Valeur |"
            echo "|-------|--------|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Path | \`${{ env.DEPLOY_PATH }}/troco/frontend/dist\` |"
            echo "| Service | \`troco-frontend\` |"
            echo "| Gate | Vitest + Playwright OK |"
          } >> "$GITHUB_STEP_SUMMARY"
