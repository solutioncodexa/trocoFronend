name: Troco Frontend Deploy

on:
  push:
    branches: [feature/shopify, shopify, main, master]
  workflow_dispatch:
    inputs:
      vite_api_base_url:
        description: "VITE_API_BASE_URL au build (vide = vars ou /api)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: troco-front-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/goldyara/deployment' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: |
      vars.VPS_DEPLOY_DISABLED != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Resolve VITE_API_BASE_URL
        id: vite_api
        run: |
          if [ -n "${{ github.event.inputs.vite_api_base_url }}" ]; then
            echo "url=${{ github.event.inputs.vite_api_base_url }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "url=${{ vars.VITE_API_BASE_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=/api" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        env:
          VITE_API_BASE_URL: ${{ steps.vite_api.outputs.url }}
        run: npm run build

      - name: Prepare artifact
        run: |
          test -f dist/index.html
          tar -czf web-dist.tar.gz -C dist .
          du -sh web-dist.tar.gz

      - name: Validate VPS deploy config
        env:
          H: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          U: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          K: ${{ secrets.VPS_SSH_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -e
          rc=0
          [ -z "${H:-}" ] && echo "::error::Missing VPS_HOST" && rc=1
          [ -z "${U:-}" ] && echo "::error::Missing VPS_USER" && rc=1
          [ -z "${K:-}" ] && echo "::error::Missing VPS_SSH_PRIVATE_KEY" && rc=1
          exit "$rc"

      - name: Prepare VPS frontend directory
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || vars.VPS_SSH_PORT || 22 }}
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/goldyara/deployment}"
            mkdir -p "${DEPLOY_PATH}/troco/frontend/_upload"

      - name: Copy build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || vars.VPS_SSH_PORT || 22 }}
          source: "web-dist.tar.gz"
          target: "${{ env.DEPLOY_PATH }}/troco/frontend/_upload/"

      - name: Swap dist + restart frontend
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || vars.VPS_SSH_PORT || 22 }}
          command_timeout: 15m
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/goldyara/deployment}"
            FRONT_ROOT="${DEPLOY_PATH}/troco/frontend"
            ARCHIVE="${FRONT_ROOT}/_upload/web-dist.tar.gz"
            STAGED="${FRONT_ROOT}/_upload/dist"

            if [ ! -f "${ARCHIVE}" ]; then
              echo "ERROR: ${ARCHIVE} introuvable après upload"
              find "${FRONT_ROOT}/_upload" -maxdepth 3 || true
              exit 1
            fi

            rm -rf "${STAGED}"
            mkdir -p "${STAGED}"
            tar -xzf "${ARCHIVE}" -C "${STAGED}"
            test -f "${STAGED}/index.html" || { echo "index.html missing"; ls -la "${STAGED}"; exit 1; }

            rm -rf "${FRONT_ROOT}/dist.previous"
            if [ -d "${FRONT_ROOT}/dist" ]; then
              mv "${FRONT_ROOT}/dist" "${FRONT_ROOT}/dist.previous"
            fi
            mv "${STAGED}" "${FRONT_ROOT}/dist"
            rm -rf "${FRONT_ROOT}/_upload"

            cd "${DEPLOY_PATH}"
            if [ ! -f .env.troco ] || [ ! -f docker-compose.troco.yml ]; then
              echo "WARN: sidecar Troco pas encore bootstrappé — dist uploadée"
              echo "INFO: lancez d'abord le deploy backend, puis re-run ce workflow"
              exit 0
            fi

            if [ -f docker-compose.yml ] && [ -f docker-compose.artifacts.yml ] && [ -f .env ]; then
              COMPOSE=(docker compose --env-file .env --env-file .env.troco -f docker-compose.yml -f docker-compose.artifacts.yml -f docker-compose.troco.yml)
            else
              COMPOSE=(docker compose -f docker-compose.troco.yml --env-file .env.troco -p troco)
            fi

            echo "Recreate troco-frontend..."
            "${COMPOSE[@]}" up -d --force-recreate --no-deps troco-frontend
            rm -rf "${FRONT_ROOT}/dist.previous"

            echo "Attente healthcheck frontend..."
            HEALTHY=""
            for i in $(seq 1 20); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' troco-frontend 2>/dev/null || echo "unknown")
              echo "  [${i}/20] status=${STATUS}"
              if [ "${STATUS}" = "healthy" ]; then
                echo "troco-frontend healthy"
                HEALTHY=1
                break
              fi
              sleep 5
            done
            if [ -z "${HEALTHY}" ]; then
              echo "Timeout/échec healthcheck — logs:"
              docker logs troco-frontend --tail 200 || true
              exit 1
            fi

            echo "Verification attachement reseau proxy..."
            if ! docker network inspect goldyara_goldyara-net --format '{{range .Containers}}{{.Name}} {{end}}' 2>/dev/null | grep -qw troco-frontend; then
              echo "::error::troco-frontend n'est pas attache au reseau goldyara_goldyara-net"
              docker inspect --format='{{json .NetworkSettings.Networks}}' troco-frontend || true
              exit 1
            fi

            if docker ps --format '{{.Names}}' | grep -qx goldyara-nginx; then
              echo "Verification resolution depuis goldyara-nginx..."
              if ! docker exec goldyara-nginx sh -c "wget -q -T 5 -O- http://troco-frontend:80/healthz >/dev/null" 2>/dev/null; then
                echo "::error::goldyara-nginx ne joint pas troco-frontend:80 (502 probable)"
                exit 1
              fi
              echo "OK: goldyara-nginx joint troco-frontend"
            fi

      - name: Deploy summary
        if: success()
        run: |
          {
            echo "### Troco frontend déployé"
            echo ""
            echo "| Champ | Valeur |"
            echo "|-------|--------|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Path | \`${{ env.DEPLOY_PATH }}/troco/frontend/dist\` |"
            echo "| Service | \`troco-frontend\` |"
            echo "| API build | \`${{ steps.vite_api.outputs.url }}\` |"
            echo "| Web | \`https://getstore.codexa-solution.com\` |"
          } >> "$GITHUB_STEP_SUMMARY"
