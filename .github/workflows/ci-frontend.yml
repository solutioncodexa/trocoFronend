name: CI Frontend (Artifacts)

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "index.html"
      - ".github/workflows/ci-frontend.yml"
  workflow_dispatch:
    inputs:
      vite_api_base_url:
        description: "VITE_API_BASE_URL au build (vide = vars.VITE_API_BASE_URL ou /api)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: troco-front-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Resolve VITE_API_BASE_URL
        id: vite_api
        run: |
          if [ -n "${{ github.event.inputs.vite_api_base_url }}" ]; then
            echo "url=${{ github.event.inputs.vite_api_base_url }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "url=${{ vars.VITE_API_BASE_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=/api" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ steps.vite_api.outputs.url }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: troco-frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy-frontend:
    name: Deploy frontend on VPS
    needs: build-frontend
    runs-on: ubuntu-latest
    if: |
      success() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      vars.VPS_DEPLOY_DISABLED != 'true'
    steps:
      - name: Validate VPS deploy config
        env:
          H: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          U: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          K: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -e
          rc=0
          [ -z "${H:-}" ] && echo "::error::Missing VPS_HOST or VPS_IP" && rc=1
          [ -z "${U:-}" ] && echo "::error::Missing VPS_USER" && rc=1
          [ -z "${K:-}" ] && echo "::error::Missing VPS_SSH_PRIVATE_KEY" && rc=1
          exit "$rc"

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: troco-frontend-dist
          path: deploy-download

      - name: Prepare Troco frontend directory on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ vars.VPS_SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            DEPLOY_PATH=/opt/troco/deployment
            FRONT_ROOT=$DEPLOY_PATH/troco/frontend
            DIST_DIR=$FRONT_ROOT/dist
            UPLOAD_DIR=$FRONT_ROOT/dist-upload

            echo "DEPLOY_PATH=$DEPLOY_PATH"
            echo "FRONT_ROOT=$FRONT_ROOT"
            echo "DIST_DIR=$DIST_DIR"
            echo "UPLOAD_DIR=$UPLOAD_DIR"

            mkdir -p "$DIST_DIR" "$UPLOAD_DIR"
            rm -rf "$DIST_DIR"/* "$UPLOAD_DIR"/*

      - name: Upload dist payload to VPS staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ vars.VPS_SSH_PORT || '22' }}
          source: "deploy-download/*"
          target: "/opt/troco/deployment/troco/frontend/dist-upload"

      - name: Normalize Troco dist structure on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ vars.VPS_SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            FRONT_ROOT=/opt/troco/deployment/troco/frontend
            DIST_DIR="$FRONT_ROOT/dist"
            UPLOAD_DIR="$FRONT_ROOT/dist-upload"

            mkdir -p "$DIST_DIR"
            cd "$FRONT_ROOT"

            if [ -d "$UPLOAD_DIR/deploy-download" ]; then
              mv "$UPLOAD_DIR/deploy-download/"* "$DIST_DIR/" || true
              rm -rf "$UPLOAD_DIR/deploy-download"
            fi
            if [ -d "$UPLOAD_DIR/frontend-dist" ]; then
              mv "$UPLOAD_DIR/frontend-dist/"* "$DIST_DIR/" || true
              rm -rf "$UPLOAD_DIR/frontend-dist"
            fi

            # If files are directly in dist-upload, move them too.
            find "$UPLOAD_DIR" -maxdepth 1 -type f -exec mv {} "$DIST_DIR/" \; || true

            [ -f "$DIST_DIR/index.html" ] || { echo "Frontend dist invalid: index.html missing"; exit 1; }

      - name: Restart Troco frontend on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ vars.VPS_SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            cd /opt/troco/deployment
            docker compose -f docker-compose.yml -f docker-compose.artifacts.yml up -d --force-recreate --no-deps frontend

      - name: Deploy summary
        run: |
          {
            echo "### Frontend artifact deployed"
            echo ""
            echo "- Path: \`${{ vars.VPS_DEPLOY_PATH || '/opt/troco/deployment' }}/troco/frontend/dist\`"
            echo "- Service: \`frontend\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/troco/deployment' }}
