# Build & push image Docker frontend — GHCR (tags sha-* + latest sur main/master)
# Deploiement SSH optionnel : variable repo VPS_DEPLOY_ENABLED=true + secrets (voir job deploy-vps).

name: Publish Docker image

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "index.html"
      - "Dockerfile"
      - "nginx.conf"
      - ".github/workflows/publish-docker.yml"
  workflow_dispatch:
    inputs:
      vite_api_base_url:
        description: "VITE_API_BASE_URL au build (vide = /api relatif, ou vars.VITE_API_BASE_URL)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: goldyara-front-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR = minuscules)
        id: names
        run: |
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${owner_lc}/goldyara-frontend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Registry login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: VITE_API_BASE_URL pour le build
        id: vite_api
        run: |
          if [ -n "${{ github.event.inputs.vite_api_base_url }}" ]; then
            echo "url=${{ github.event.inputs.vite_api_base_url }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "url=${{ vars.VITE_API_BASE_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=/api" >> "$GITHUB_OUTPUT"
          fi

      - name: Tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.ref_name == 'master' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ steps.vite_api.outputs.url }}

      - name: Summary
        run: |
          {
            echo "### Image frontend poussée"
            echo ""
            echo "- **Image** \`${{ steps.names.outputs.image }}\`"
            echo "- **Digest** \`${{ steps.push.outputs.digest }}\`"
            echo "- Rollback VPS : \`GOLDYARA_FRONT_TAG=sha-xxxxxx\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deploiement VPS : desactiver avec variable repo VPS_DEPLOY_DISABLED=true
  deploy-vps:
    name: Deploy frontend on VPS
    needs: docker-publish
    runs-on: ubuntu-latest
    if: |
      success() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      vars.VPS_DEPLOY_DISABLED != 'true'
    steps:
      - id: vps_deploy_ready
        name: Deploiement SSH possible ?
        env:
          H: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          U: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          K: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$H" ] && [ -n "$U" ] && [ -n "$K" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploiement SSH saute — config manquante
        if: steps.vps_deploy_ready.outputs.ready != 'true'
        env:
          H: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          U: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          K: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          echo "::warning::Deploy SSH non execute pour ${{ github.repository }}"
          [ -z "$H" ] && echo "::warning::Manquant : VPS_HOST ou VPS_IP"
          [ -z "$U" ] && echo "::warning::Manquant : VPS_USER"
          [ -z "$K" ] && echo "::warning::Manquant : VPS_SSH_PRIVATE_KEY"

      - name: SSH — pull GHCR + up frontend
        if: steps.vps_deploy_ready.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || vars.VPS_IP }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || vars.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ vars.VPS_SSH_PORT || '22' }}
          command_timeout: 20m
          envs: DEPLOY_PATH,GHCR_PULL_TOKEN,GITHUB_REPO_OWNER_LC,GITHUB_SHA_FULL
          script_stop: true
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH}" || { echo "ERREUR: cd ${DEPLOY_PATH}"; exit 1; }
            SHA_TAG="sha-$(printf '%s' "${GITHUB_SHA_FULL}" | cut -c1-7)"
            OWNER_LC=$(echo "${GITHUB_REPO_OWNER_LC}" | tr '[:upper:]' '[:lower:]')
            echo "==> Frontend deploy  SHA=${SHA_TAG}  path=$(pwd)"
            if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
              echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "${OWNER_LC}" --password-stdin
            else
              echo "(!) Pas de GHCR_PULL_TOKEN : obligatoire si images GHCR privees."
            fi
            set -a
            # shellcheck disable=SC1091
            [ -f .env ] && . ./.env
            set +a
            if [ -z "${GOLDYARA_FRONT_IMAGE:-}" ]; then
              echo "ERREUR: sur le VPS, deployment/.env doit contenir GOLDYARA_FRONT_IMAGE=ghcr.io/${OWNER_LC}/goldyara-frontend"
              exit 1
            fi
            if grep -q '^GOLDYARA_FRONT_TAG=' .env 2>/dev/null; then
              sed -i "s/^GOLDYARA_FRONT_TAG=.*/GOLDYARA_FRONT_TAG=${SHA_TAG}/" .env
            else
              echo "GOLDYARA_FRONT_TAG=${SHA_TAG}" >> .env
            fi
            echo "==> Image attendue : ${GOLDYARA_FRONT_IMAGE}:${SHA_TAG}"
            docker compose -f docker-compose.yml -f docker-compose.cd.yml pull frontend
            docker compose -f docker-compose.yml -f docker-compose.cd.yml up -d --no-deps frontend
            sleep 8
            docker compose -f docker-compose.yml -f docker-compose.cd.yml ps frontend
            docker compose -f docker-compose.yml -f docker-compose.cd.yml exec -T nginx nginx -s reload || true
            echo "OK frontend redeploye."
        env:
          DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/goldyara/deployment' }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GITHUB_REPO_OWNER_LC: ${{ github.repository_owner }}
          GITHUB_SHA_FULL: ${{ github.sha }}

      - name: Resume deploy VPS
        if: steps.vps_deploy_ready.outputs.ready == 'true'
        run: |
          {
            echo "### Deploiement frontend sur le VPS"
            echo "Tag : sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          } >> "$GITHUB_STEP_SUMMARY"

